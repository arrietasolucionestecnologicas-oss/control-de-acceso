<!doctype html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Panel Admin — A.S.T.</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="./icon.svg">
<meta name="theme-color" content="#0f172a">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="AST Admin">
<style>
  body{font-family:system-ui,Arial,sans-serif;background:#0f172a;color:#e2e8f0;display:flex;align-items:center;justify-content:center;min-height:100vh;margin:0;padding:1.5rem}
  .card{background:#1e293b;padding:2rem;border-radius:12px;width:100%;max-width:380px;box-shadow:0 10px 30px rgba(0,0,0,.3)}
  h1{font-size:1.1rem;margin:0 0 1.25rem}
  label{display:block;font-size:.85rem;margin-bottom:.25rem;color:#94a3b8}
  input{width:100%;padding:.6rem;margin-bottom:1rem;border-radius:6px;border:1px solid #334155;background:#0f172a;color:#e2e8f0;box-sizing:border-box}
  button{width:100%;padding:.7rem;border:none;border-radius:6px;background:#2563eb;color:#fff;font-weight:600;cursor:pointer}
  button:disabled{opacity:.6;cursor:default}
  .error{color:#f87171;font-size:.85rem;margin-bottom:1rem;min-height:1.2em}
  .fila{display:flex;align-items:center;justify-content:space-between;background:#0f172a;border:1px solid #334155;border-radius:8px;padding:.85rem 1rem;margin-bottom:.6rem}
  .fila .nombre{font-weight:600}
  .estado{font-size:.8rem;padding:.2rem .6rem;border-radius:999px;font-weight:600}
  .estado.on{background:#166534;color:#bbf7d0}
  .estado.off{background:#7f1d1d;color:#fecaca}
  .toggle{padding:.45rem .9rem;border-radius:6px;border:none;font-weight:600;cursor:pointer;font-size:.8rem}
  .toggle.apagar{background:#dc2626;color:#fff}
  .toggle.encender{background:#16a34a;color:#fff}
  #panel{display:none}
  .titulo-panel{font-size:.8rem;color:#64748b;margin:0 0 .75rem;text-transform:uppercase;letter-spacing:.05em}
  #toast{position:fixed;left:50%;bottom:1.5rem;transform:translateX(-50%) translateY(20px);background:#166534;color:#fff;padding:.7rem 1.25rem;border-radius:8px;font-size:.85rem;font-weight:600;box-shadow:0 8px 20px rgba(0,0,0,.4);opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;z-index:999}
  #toast.mostrar{opacity:1;transform:translateX(-50%) translateY(0)}
  #toast.error{background:#7f1d1d}
  .toggle.cargando{opacity:.6;cursor:default}
</style>
</head>
<body>
  <div class="card">
    <h1>🔒 Panel de Control — A.S.T.</h1>

    <div id="loginView">
      <div class="error" id="errorMsg"></div>
      <label for="usuario">Usuario</label>
      <input id="usuario" type="text" autocomplete="username">
      <label for="password">Contraseña</label>
      <input id="password" type="password" autocomplete="current-password">
      <button id="btnLogin">Entrar</button>
    </div>

    <div id="panel">
      <p class="titulo-panel">Estado de los servicios</p>
      <div id="filas"></div>
      <div class="error" id="errorPanel" style="margin-top:.5rem"></div>
    </div>
  </div>

  <div id="toast"></div>

<script>
  var CONTROL_ACCESO_URL = 'https://script.google.com/macros/s/AKfycby4K-qxW87hfd9Fy1wKHeyF8bic_Qo8clKfJ-ZuPg9zElNuc7XOe8qTgW8sUmJ9mnKjDA/exec';
  var TOKEN_KEY = 'jlb_admin_token';
  var NOMBRES = { GLOBAL: 'TODO (interruptor general)', PRODUCCION: 'Producción (JLB)', PRUEBAS: 'App de Campo (JLB)', ALMACEN: 'Almacén (JLB)', MYA_PRUEBAS: 'App Pruebas (M&A)' };
  var ORDEN = ['GLOBAL', 'PRODUCCION', 'PRUEBAS', 'ALMACEN', 'MYA_PRUEBAS'];

  function getToken() {
    try { return sessionStorage.getItem(TOKEN_KEY); } catch (e) { return null; }
  }

  function login() {
    var usuario = document.getElementById('usuario').value.trim();
    var password = document.getElementById('password').value;
    var errorEl = document.getElementById('errorMsg');
    errorEl.textContent = '';

    if (!usuario || !password) {
      errorEl.textContent = 'Completa usuario y contraseña.';
      return;
    }

    var btn = document.getElementById('btnLogin');
    btn.disabled = true;
    btn.textContent = 'Verificando...';

    var url = CONTROL_ACCESO_URL + '?action=login&usuario=' + encodeURIComponent(usuario) + '&password=' + encodeURIComponent(password);

    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.textContent = 'Entrar';

        if (!data.ok) {
          errorEl.textContent = 'Usuario o contraseña incorrectos.';
          return;
        }
        if (data.role !== 'Administrador') {
          errorEl.textContent = 'Esta cuenta no tiene permisos de administrador.';
          return;
        }

        try { sessionStorage.setItem(TOKEN_KEY, data.token); } catch (e) {}
        mostrarPanel();
      })
      .catch(function () {
        btn.disabled = false;
        btn.textContent = 'Entrar';
        errorEl.textContent = 'No se pudo contactar el servidor.';
      });
  }

  function cargarEstado() {
    var token = getToken();
    fetch(CONTROL_ACCESO_URL + '?action=getStatus&token=' + encodeURIComponent(token), { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        if (!data.ok) {
          document.getElementById('errorPanel').textContent = 'Sesión no válida, vuelve a iniciar sesión.';
          try { sessionStorage.removeItem(TOKEN_KEY); } catch (e) {}
          document.getElementById('panel').style.display = 'none';
          document.getElementById('loginView').style.display = 'block';
          return;
        }
        renderFilas(data.estado);
      })
      .catch(function () {
        document.getElementById('errorPanel').textContent = 'No se pudo contactar el servidor.';
      });
  }

  var estadoActual = {};

  function renderFilas(estado) {
    estadoActual = estado;
    var cont = document.getElementById('filas');
    cont.innerHTML = '';
    ORDEN.forEach(function (appId) {
      var activo = !!estado[appId];
      var fila = document.createElement('div');
      fila.className = 'fila';
      fila.id = 'fila-' + appId;

      var nombre = document.createElement('span');
      nombre.className = 'nombre';
      nombre.textContent = NOMBRES[appId] || appId;

      var derecha = document.createElement('div');
      derecha.style.display = 'flex';
      derecha.style.alignItems = 'center';
      derecha.style.gap = '.6rem';

      var badge = document.createElement('span');
      badge.className = 'estado ' + (activo ? 'on' : 'off');
      badge.textContent = activo ? 'ACTIVO' : 'SUSPENDIDO';

      var btn = document.createElement('button');
      btn.className = 'toggle ' + (activo ? 'apagar' : 'encender');
      btn.textContent = activo ? 'Suspender' : 'Activar';
      btn.addEventListener('click', function () { cambiarEstado(appId, !activo, fila); });

      derecha.appendChild(badge);
      derecha.appendChild(btn);
      fila.appendChild(nombre);
      fila.appendChild(derecha);
      cont.appendChild(fila);
    });
  }

  function pintarFila(appId, activo, fila) {
    var badge = fila.querySelector('.estado');
    var btn = fila.querySelector('.toggle');
    badge.className = 'estado ' + (activo ? 'on' : 'off');
    badge.textContent = activo ? 'ACTIVO' : 'SUSPENDIDO';
    btn.className = 'toggle ' + (activo ? 'apagar' : 'encender');
    btn.textContent = activo ? 'Suspender' : 'Activar';
  }

  var toastTimeoutId = null;

  function mostrarToast(texto, esError) {
    var toast = document.getElementById('toast');
    toast.textContent = texto;
    toast.className = esError ? 'mostrar error' : 'mostrar';
    if (toastTimeoutId) clearTimeout(toastTimeoutId);
    toastTimeoutId = setTimeout(function () {
      toast.className = toast.className.replace('mostrar', '').trim();
    }, 2500);
  }

  function cambiarEstado(appId, nuevoValor, fila) {
    // Actualiza la pantalla de inmediato (optimista) y marca "guardando..." mientras confirma el servidor.
    pintarFila(appId, nuevoValor, fila);
    estadoActual[appId] = nuevoValor;
    document.getElementById('errorPanel').textContent = '';

    var btn = fila.querySelector('.toggle');
    btn.disabled = true;
    btn.classList.add('cargando');
    mostrarToast((NOMBRES[appId] || appId) + ': guardando...', false);

    var token = getToken();
    var url = CONTROL_ACCESO_URL + '?action=setAppActive&token=' + encodeURIComponent(token) +
      '&appId=' + encodeURIComponent(appId) + '&activo=' + (nuevoValor ? 'true' : 'false');

    fetch(url, { cache: 'no-store' })
      .then(function (r) { return r.json(); })
      .then(function (data) {
        btn.disabled = false;
        btn.classList.remove('cargando');
        if (!data.ok) {
          pintarFila(appId, !nuevoValor, fila);
          estadoActual[appId] = !nuevoValor;
          document.getElementById('errorPanel').textContent = 'No se pudo cambiar el estado, intenta de nuevo.';
          mostrarToast('✗ No se guardó: ' + (NOMBRES[appId] || appId), true);
          return;
        }
        mostrarToast('✓ ' + (NOMBRES[appId] || appId) + (nuevoValor ? ' activado' : ' suspendido'), false);
      })
      .catch(function () {
        btn.disabled = false;
        btn.classList.remove('cargando');
        pintarFila(appId, !nuevoValor, fila);
        estadoActual[appId] = !nuevoValor;
        document.getElementById('errorPanel').textContent = 'No se pudo contactar el servidor.';
        mostrarToast('✗ Sin conexión con el servidor', true);
      });
  }

  function mostrarPanel() {
    document.getElementById('loginView').style.display = 'none';
    document.getElementById('panel').style.display = 'block';
    cargarEstado();
  }

  document.getElementById('btnLogin').addEventListener('click', login);

  if (getToken()) {
    mostrarPanel();
  }
</script>
</body>
</html>
